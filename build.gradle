plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Xaero's mods maven, needed to compile against HudMod / world map screen classes
    maven {
        url "https://chocolateminecraft.com/maven"
        name "Xaero's Maven"
    }
    mavenCentral()
}

dependencies {
    // Minecraft 26.1.2 ships unobfuscated - no `mappings` block is needed
    // (Loom errors out if you try to apply Mojang/Yarn mappings on top of it).
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Xaero's mods: compileOnly, not bundled. Players are expected to install
    // Xaero's Minimap + World Map themselves. No "mod" prefix needed since
    // 26.1.2 has no obfuscation left to remap.
    compileOnly "xaero.minimap:xaerominimap-fabric-${project.minecraft_version}:${project.xaero_minimap_version}"
    compileOnly "xaero.map:xaeroworldmap-fabric-${project.minecraft_version}:${project.xaero_worldmap_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
